
name: E-commerce Data Platform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ========================================
  # Job 1: Python Ingestion CI
  # ========================================
  python-check:
    name: Python Ingestion Check
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall -q ingestion
          echo "Python syntax check passed."

  # ========================================
  # Job 2: dbt Project CI
  # ========================================
  dbt-check:
    name: dbt Project Check
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: ecomerce_dbt

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r ../requirements-dbt.txt

      - name: Create Temporary dbt Profile
        shell: bash
        run: |
          PROFILE_DIR="$RUNNER_TEMP/dbt_profiles"

          mkdir -p "$PROFILE_DIR"

          echo "DBT_PROFILES_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"

          cat > "$PROFILE_DIR/profiles.yml" <<'YAML'
          ecomerce_dbt:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci-placeholder
                user: ci-placeholder
                password: not-used
                role: ECOM_LOADER
                database: ECOM_RAW
                warehouse: ECOM_WH
                schema: ANALYTICS
                threads: 4
          YAML

      - name: Verify dbt Version
        run: |
          dbt --version

      - name: Parse dbt Project
        run: |
          dbt parse --no-partial-parse
          echo "dbt project parsing passed."
