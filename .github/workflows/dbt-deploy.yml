
name: dbt Production Deployment

on:
  # Keep manual deployment available
  workflow_dispatch:

  # Automatically deploy after successful Snowflake CI on main
  workflow_run:
    workflows:
      - Snowflake dbt Integration CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: dbt-production-deploy
  cancel-in-progress: false

jobs:

  # ========================================
  # Job 1: Python Pre-deployment Check
  # ========================================
  python-preflight:
    name: Python Pre-deployment Check

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python Syntax
        run: |
          python -m compileall -q ingestion

      - name: Run Python Unit Tests
        run: |
          python -m pytest tests/ -v

  # ========================================
  # Job 2: Production dbt Deployment
  # ========================================
  production-deployment:
    name: Production dbt Build

    needs: python-preflight

    if: >-
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')

    runs-on: ubuntu-24.04
    timeout-minutes: 30

    environment:
      name: production
      deployment: true

    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_DEPLOY_ACCOUNT }}
      SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_DEPLOY_KEY_PASSPHRASE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dbt.txt

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dbt.txt

      - name: Create Temporary Production Profile
        shell: bash
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          PROFILE_DIR="$RUNNER_TEMP/dbt_prod_profiles"
          KEY_FILE="$RUNNER_TEMP/snowflake_deploy_key.p8"

          mkdir -p "$PROFILE_DIR"
          umask 077

          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$KEY_FILE"

          echo "DBT_PROFILES_DIR=$PROFILE_DIR" >> "$GITHUB_ENV"
          echo "DBT_DEPLOY_KEY_FILE=$KEY_FILE" >> "$GITHUB_ENV"

          cat > "$PROFILE_DIR/profiles.yml" <<'YAML'
          ecomerce_dbt:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
                user: ECOM_DEPLOY_USER
                role: ECOM_DEPLOY
                private_key_path: "{{ env_var('DBT_DEPLOY_KEY_FILE') }}"
                private_key_passphrase: "{{ env_var('SNOWFLAKE_KEY_PASSPHRASE') }}"
                warehouse: ECOM_WH
                database: ECOM_RAW
                schema: ANALYTICS
                threads: 4
          YAML

      - name: Verify Production Connection
        working-directory: ecomerce_dbt
        run: |
          dbt debug --target prod

      - name: Preview Production Models
        working-directory: ecomerce_dbt
        run: |
          dbt ls --target prod

      - name: Build Production Models and Run Data Tests
        working-directory: ecomerce_dbt
        run: |
          dbt build --target prod

      - name: Remove Temporary Credentials
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/snowflake_deploy_key.p8"
          rm -rf "$RUNNER_TEMP/dbt_prod_profiles"
