
name: Snowflake CI Schema Cleanup

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

# 与 dbt Integration CI 使用同一并发组
# 避免同一个 PR 的构建与清理同时进行
concurrency:
  group: snowflake-dbt-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup-schema:
    name: Cleanup PR Snowflake Schema
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Snowflake Connector
        run: |
          python -m pip install "snowflake-connector-python>=4,<6"

      - name: Drop PR CI Schema Safely
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_CI_ACCOUNT }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
          SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_KEY_PASSPHRASE }}
        run: |
          python - <<'PY'
          import os
          import re
          import tempfile
          from pathlib import Path

          import snowflake.connector

          # 1. 验证 PR 编号
          raw_number = os.environ["PR_NUMBER"]

          if not re.fullmatch(r"[1-9][0-9]*", raw_number):
              raise ValueError("Invalid PR number")

          pr_number = int(raw_number)
          schema = f"ANALYTICS_CI_PR_{pr_number}"
          database = "ECOM_RAW"

          # 2. 严格限制目标 Schema
          if not re.fullmatch(
              r"ANALYTICS_CI_PR_[1-9][0-9]*",
              schema,
          ):
              raise ValueError("Unsafe schema name")

          full_name = f"{database}.{schema}"

          print(f"PR: #{pr_number}")
          print(f"Cleanup target: {full_name}")

          # 3. 使用临时私钥连接 Snowflake
          with tempfile.TemporaryDirectory() as temp_dir:
              key_file = Path(temp_dir) / "ci_key.p8"

              key_file.write_text(
                  os.environ["SNOWFLAKE_PRIVATE_KEY"],
                  encoding="utf-8",
              )
              key_file.chmod(0o600)

              conn = snowflake.connector.connect(
                  account=os.environ["SNOWFLAKE_ACCOUNT"],
                  user="ECOM_CI_USER",
                  role="ECOM_CI",
                  authenticator="SNOWFLAKE_JWT",
                  private_key_file=str(key_file),
                  private_key_password=os.environ[
                      "SNOWFLAKE_KEY_PASSPHRASE"
                  ],
                  warehouse="ECOM_WH",
                  database=database,
                  schema="INFORMATION_SCHEMA",
              )

              try:
                  with conn.cursor() as cursor:

                      # 4. 检查 Schema 是否存在及所有权
                      cursor.execute(
                          """
                          SELECT SCHEMA_OWNER
                          FROM ECOM_RAW.INFORMATION_SCHEMA.SCHEMATA
                          WHERE CATALOG_NAME = %s
                            AND SCHEMA_NAME = %s
                          """,
                          (database, schema),
                      )

                      result = cursor.fetchone()

                      if result is None:
                          print("Schema not found. Nothing to delete.")
                      else:
                          owner = result[0]

                          if owner != "ECOM_CI":
                              raise PermissionError(
                                  f"Unexpected schema owner: {owner}"
                              )

                          print("Owner verified: ECOM_CI")

                          # 5. 删除 PR 专属测试 Schema
                          cursor.execute(
                              f"DROP SCHEMA {full_name} CASCADE"
                          )

                          print(f"Dropped: {full_name}")

                          # 6. 删除后再次查询
                          cursor.execute(
                              """
                              SELECT SCHEMA_NAME
                              FROM ECOM_RAW.INFORMATION_SCHEMA.SCHEMATA
                              WHERE CATALOG_NAME = %s
                                AND SCHEMA_NAME = %s
                              """,
                              (database, schema),
                          )

                          if cursor.fetchone() is not None:
                              raise RuntimeError(
                                  "Schema still exists after cleanup"
                              )

                          print("Cleanup verification passed.")

              finally:
                  conn.close()

          PY
