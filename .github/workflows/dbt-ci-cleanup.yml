
name: Snowflake CI Schema Cleanup

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

permissions:
  contents: read

jobs:
  preview-cleanup:
    name: Preview PR Schema Cleanup

    # 只处理本仓库内部的 PR
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Snowflake Connector
        run: |
          python -m pip install "snowflake-connector-python>=4,<6"

      - name: Preview Snowflake Schema
        shell: bash
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_CI_ACCOUNT }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
          SNOWFLAKE_KEY_PASSPHRASE: ${{ secrets.SNOWFLAKE_CI_KEY_PASSPHRASE }}
        run: |
          python - <<'PY'
          import os
          import re
          import tempfile
          from pathlib import Path

          import snowflake.connector

          pr_number = int(os.environ["PR_NUMBER"])
          if pr_number <= 0:
              raise ValueError("Invalid PR number")

          schema = f"ANALYTICS_CI_PR_{pr_number}"

          if not re.fullmatch(r"ANALYTICS_CI_PR_[0-9]+", schema):
              raise ValueError("Unsafe schema name")

          print(f"PR number: {pr_number}")
          print(f"Target schema: ECOM_RAW.{schema}")
          print("Mode: PREVIEW ONLY")

          with tempfile.TemporaryDirectory() as temp_dir:
              key_file = Path(temp_dir) / "ci_key.p8"
              key_file.write_text(
                  os.environ["SNOWFLAKE_PRIVATE_KEY"],
                  encoding="utf-8",
              )
              key_file.chmod(0o600)

              conn = snowflake.connector.connect(
                  account=os.environ["SNOWFLAKE_ACCOUNT"],
                  user="ECOM_CI_USER",
                  role="ECOM_CI",
                  authenticator="SNOWFLAKE_JWT",
                  private_key_file=str(key_file),
                  private_key_password=os.environ[
                      "SNOWFLAKE_KEY_PASSPHRASE"
                  ],
                  warehouse="ECOM_WH",
                  database="ECOM_RAW",
                  schema="INFORMATION_SCHEMA",
              )

              try:
                  with conn.cursor() as cursor:
                      cursor.execute(
                          """
                          SELECT SCHEMA_NAME
                          FROM ECOM_RAW.INFORMATION_SCHEMA.SCHEMATA
                          WHERE SCHEMA_NAME = %s
                          """,
                          (schema,),
                      )
                      result = cursor.fetchone()

                      if result:
                          print(f"FOUND: ECOM_RAW.{schema}")
                      else:
                          print(f"NOT FOUND: ECOM_RAW.{schema}")

                  print("No schema was deleted.")

              finally:
                  conn.close()
          PY
